<style id="evora-motion-refinement">
/* EVORA / Motion & interaction system. CSS only; no data or logic changes. */
:root {
  --ease-out:cubic-bezier(.16,1,.3,1);
  --ease-standard:cubic-bezier(.2,.65,.3,1);
  --fast:130ms; --normal:220ms; --slow:340ms;
  --focus-ring:0 0 0 3px #a78bfa24;
  --raised:0 10px 28px #00000026;
}
@media screen {
  html {scroll-padding-top:90px;scroll-behavior:smooth}
  body {background:radial-gradient(ellipse at 85% 0%,#a78bfa08,transparent 42rem),var(--bg)}
  button {transition:background-color var(--normal) var(--ease-standard),border-color var(--normal) var(--ease-standard),color var(--fast),box-shadow var(--normal) var(--ease-standard),transform var(--fast) var(--ease-out),opacity var(--normal);touch-action:manipulation}
  button:active:not(:disabled){transform:scale(.97);transition-duration:90ms}
  button:disabled{transform:none;box-shadow:none}
  .primary{background:linear-gradient(115deg,#b69afb,#a78bfa 55%,#9275df);background-size:160% 100%;background-position:0 50%;box-shadow:0 3px 12px #a78bfa14;transition:background-position var(--slow) var(--ease-out),box-shadow var(--normal),transform var(--fast),filter var(--normal)}
  .primary:hover:not(:disabled){background-position:100% 50%;background-image:linear-gradient(115deg,#b69afb,#a78bfa 55%,#9275df);background-color:transparent;filter:brightness(1.08);box-shadow:0 6px 18px #a78bfa24}
  input,select,textarea{transition:border-color var(--normal),box-shadow var(--normal) var(--ease-out),background-color var(--normal);caret-color:var(--lilac)}
  input:focus,select:focus,textarea:focus{background-color:#14141b;box-shadow:var(--focus-ring)}
  input[type=checkbox]{transition:filter var(--fast),transform var(--fast);accent-color:var(--purple)}
  input[type=checkbox]:checked{accent-color:var(--green)}
  a{transition:color var(--fast);text-underline-offset:3px}
  a:hover{color:var(--text)}
  aside{scrollbar-width:thin;overscroll-behavior:contain;background:linear-gradient(180deg,#1b1a23 0%,var(--surface) 38%);box-shadow:1px 0 14px #00000010}
  .brand-mark{transition:transform var(--slow) var(--ease-out),border-color var(--normal)}
  .nav button{position:relative;min-height:42px;transition:background-color var(--normal),border-color var(--normal),color var(--normal),transform var(--fast) var(--ease-out)}
  .nav button::before{content:"";position:absolute;left:0;top:9px;bottom:9px;width:3px;background:var(--purple);border-radius:0 3px 3px 0;transform:scaleY(.25);opacity:0;transition:transform var(--normal) var(--ease-out),opacity var(--normal)}
  .nav button.active::before{transform:scaleY(1);opacity:1}
  .nav button .i{transition:color var(--normal),transform var(--normal) var(--ease-out)}
  .nav button.active .i{transform:scale(1.05)}
  header{background:#101014f2;backdrop-filter:blur(12px) saturate(120%);box-shadow:0 3px 14px #00000010}
  header .head-actions{min-width:0}
  header .focus-inline{min-width:0}
  #globalSearch{transition:background-color var(--normal),border-color var(--normal),box-shadow var(--normal)}
  .content{animation:workspace-enter var(--slow) var(--ease-out) both}
  @keyframes workspace-enter{from{opacity:0;transform:translateY(5px)}to{opacity:1;transform:none}}
  .card,.day,.notes,.hero{transition:border-color var(--normal),box-shadow var(--normal) var(--ease-out),background-color var(--normal)}
  .metric{transition:border-color var(--normal),box-shadow var(--normal) var(--ease-out),transform var(--normal) var(--ease-out)}
  .metric .i{transition:transform var(--normal) var(--ease-out),color var(--normal)}
  .number{font-variant-numeric:tabular-nums}
  .bar i{transition:width 550ms var(--ease-out);transform-origin:left;animation:progress-in 480ms var(--ease-out) both}
  @keyframes progress-in{from{transform:scaleX(0)}to{transform:scaleX(1)}}
  .chart-col i{transform-origin:bottom;animation:chart-in 420ms var(--ease-out) both;transition:filter var(--normal)}
  .chart-col:nth-child(2n) i{animation-delay:35ms}
  .chart-col:nth-child(3n) i{animation-delay:70ms}
  @keyframes chart-in{from{transform:scaleY(.06);opacity:.45}to{transform:scaleY(1);opacity:1}}
  .task{transition:background-color var(--normal),border-color var(--normal),box-shadow var(--normal),opacity var(--normal),transform var(--fast) var(--ease-out)}
  .task.done{background:#86c9a309;border-color:#86c9a325}
  .taskbody b,.tag,.checkline span{transition:color var(--normal),background-color var(--normal),border-color var(--normal)}
  .tag{line-height:1.5}
  .row-actions .icon,.task .icon{border-radius:7px;min-width:26px;min-height:26px}
  .list-row{transition:background-color var(--normal),border-color var(--normal);border-radius:5px}
  .table tbody tr{transition:background-color var(--normal)}
  .table-wrap{scrollbar-width:thin;overscroll-behavior-x:contain}
  .mini-week button.today{box-shadow:inset 0 0 0 1px #a78bfa18}
  .habit-week button.checked{box-shadow:inset 0 0 0 1px #86c9a31a}
  .timer strong{font-variant-numeric:tabular-nums;display:inline-block;min-width:5ch}
  dialog{border-radius:20px;box-shadow:0 28px 90px #0009;scrollbar-width:thin;overscroll-behavior:contain;transition:opacity var(--normal) var(--ease-out),transform var(--normal) var(--ease-out),display var(--normal) allow-discrete,overlay var(--normal) allow-discrete;opacity:0;transform:translateY(10px) scale(.985)}
  dialog[open]{animation:none;opacity:1;transform:none}
  @starting-style{dialog[open]{opacity:0;transform:translateY(10px) scale(.985)}}
  dialog::backdrop{background:#08080bbd;backdrop-filter:blur(4px);transition:background-color var(--normal),backdrop-filter var(--normal),display var(--normal) allow-discrete,overlay var(--normal) allow-discrete}
  @starting-style{dialog[open]::backdrop{background-color:#08080b00;backdrop-filter:blur(0)}}
  dialog:not([open])::backdrop{background-color:#08080b00;backdrop-filter:blur(0)}
  body:has(dialog[open]){overflow:hidden}
  .toast{border-left:3px solid var(--purple);animation:toast-in var(--slow) var(--ease-out) both}
  @keyframes toast-in{from{opacity:0;transform:translateY(10px) scale(.98)}to{opacity:1;transform:none}}
}
@media screen and (hover:hover) and (pointer:fine){
  .nav button:hover:not(.active){transform:translateX(2px)}
  .brand-mark:hover{transform:translateY(-2px);border-color:var(--purple)}
  .card:hover,.notes:hover{border-color:#403b50}
  .metric:hover{transform:translateY(-2px);border-color:#504564;box-shadow:var(--raised)}
  .metric:hover .i{transform:translateY(-1px);color:var(--lilac)}
  .day:hover{border-color:#494156}
  .task:hover{border-color:#4a415b;background-color:#1d1b27;box-shadow:0 3px 10px #0002}
  .task.done:hover{background:#86c9a310}
  .table tbody tr:hover{background-color:#a78bfa08}
  .icon:hover:not(:disabled){color:var(--lilac);background:#a78bfa15}
  .icon.danger:hover:not(:disabled){color:var(--red);background:#f0808015}
  .chart-col:hover i{filter:brightness(1.16)}
  input[type=checkbox]:hover{filter:brightness(1.2);transform:scale(1.08)}
}
@media screen and (max-width:720px){
  header{min-height:64px;z-index:12;flex-wrap:wrap}

function openForm(k,id=null,date=null,sid=null){let r=id?get(k,id):null;editing={k,id};$('modalTitle').textContent=(r?'Editar ':'Cadastrar ')+singular[k];$('formError').textContent='';let initial={date:date||today(),subjectId:sid||'',priority:'Média',category:'Trabalho',status:k==='exams'?'A estudar':'Não iniciado',color:'#A78BFA',weight:1,max:data.settings.scale,planned:30,actual:'',month:monthKey(),progress:0,target:10};$('fields').innerHTML=fields[k].map(f=>{let v=r?.[f.key]??initial[f.key]??'';if(f.key==='checklist')v=(r?.checklist||[]).map(c=>c.text).join('\n');let attrs=`id="f-${f.key}" name="${f.key}" ${f.required?'required':''} ${f.min!==undefined?`min="${f.min}"`:''} ${f.step?`step="${f.step}"`:''}`;let control=f.type==='textarea'?`<textarea ${attrs}>${esc(v)}</textarea>`:f.type==='select'?`<select ${attrs}>${opts([...new Set([...f.options,...(v&&!f.options.includes(v)?[v]:[])])],v)}</select>`:f.type==='subject'?`<select ${attrs}><option value="">Sem disciplina</option>${data.subjects.map(s=>`<option value="${esc(s.id)}" ${s.id===v?'selected':''}>${esc(s.title)}</option>`).join('')}</select>`:`<input ${attrs} type="${f.type}" value="${esc(v)}" ${f.type==='text'?'maxlength="250"':''}>`;return `<div class="${f.type==='textarea'||f.key==='title'?'wide':''}"><label for="f-${f.key}">${f.label}</label>${control}</div>`}).join('');$('modal').showModal();$('f-title').focus()}

document.addEventListener('click',e=>{let b=e.target.closest('button');if(!b)return;let d=b.dataset;if(d.view){changeView(d.view);return}if(d.new){openForm(d.new,null,d.date,d.subject);return}if(d.edit){openForm(d.edit,d.id);return}if(d.delete){deleteRecord(d.delete,d.id);return}if(d.day){anchor=parse(d.day);calendarMode='day';changeView('calendar');return}if(d.week){anchor=parse(d.week);changeView('week');return}if('subjectOpen'in d){subjectView=d.subjectOpen;render();return}if('subjectBack'in d){subjectView='';render();return}if('shift'in d){let n=Number(d.shift),m=view==='week'?'week':calendarMode;if(m==='month')anchor=new Date(anchor.getFullYear(),anchor.getMonth()+n,1);else anchor=add(anchor,n*(m==='week'?7:1));render();return}if('now'in d){anchor=new Date();render();return}if('print'in d){window.print();return}if('statusFilter'in d){filter.status=d.statusFilter;filter.upcoming=false;render();return}if('upcoming'in d){filter.status='';filter.upcoming=true;render();return}if(d.habit){let r=get('habits',d.habit);if(r&&d.date<=today()){r.logs=r.logs.includes(d.date)?r.logs.filter(x=>x!==d.date):[...r.logs,d.date];save();render()}return}if(d.timer){timerAction(d.timer);return}if(b.id==='export'){downloadJSON(data,'evora-backup-'+today()+'.json');return}if(b.id==='import')$('file').click()});

const duration=phase=>Math.round(data.settings[phase]*60),timerState=()=>data.timer||(data.timer={phase:'focus',remaining:duration('focus'),end:null,completed:0});
